    name: en_p24_anki
    selector:
    - env
    - en_p24_anki
    value: '



      Input:

      - Slides with page numbers (Page x of X)

      - Original transcript with timestamps

      - Summary

      - Refined transcript

      - TLDR

      - Anki Documentation


      Generate 8–12 high-quality Anki flashcards from the context (only from my documents;
      otherwise "Not in the context"). Rules:


      LaTeX and CSV robustness: Do not use semicolons in Anki CSV fields (escape them
      if necessary); use LaTeX only for formulas (and enclose them in `[$]...[/$]`),
      otherwise keep it concise.


      - Mix of Basic & Cloze; 1–2 clozes `{{c1::…}}` per Cloze card.

      - Back contains a detailed explanation + condition/unit if applicable + source
      (File, Page|Timecode).

      - Output as CSV lines: Front;Back (with source);Tags

      - Tags: `{{subject_chapter}}`, `difficulty_E/M/H` (Easy/Medium/Hard), `type_{{def|formula|application}}`.


      However, write the different note types in separate CSV blocks. In Anki MacOS,
      the available types are "Image Occlusion" (Bildverdeckung), "Basic" (Einfach),
      "Basic (type in the answer)" (Einfach (Antwort eintippen)), "Basic (and reversed
      card)" (Einfach (und die umgekehrte Richtung)), "Basic (optional reversed card)"
      (Einfach (und wahlweise die umgekehrte Richtung)), and "Cloze" (Lückentext).'
    value_type: string
  - description: ''
