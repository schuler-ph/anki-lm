    id: be29615c-4e20-4530-9853-b3fe752485e0
    name: en_p21_tldr
    selector:
    - env
    - en_p21_tldr
    value: 'Input:

      - Slides with page numbers (Page x of X)

      - Original transcript with timestamps

      - Summary

      - Refined transcript


      Create a one-pager (as long as it needs to be, but optimally under 300-500 words)
      based exclusively on the context: Learning objectives • Core ideas • Key formulas
      (with conditions) • Sources of error • 3 practice questions (without solutions)
      • Important ToDos and deadlines • List of sources.


      Source Priority and Conflicts: Primary: Original transcript with timestamps
      (stamped) & slides (pdf) > Secondary: Summary.md & Refined transcript. In case
      of contradictions, strictly adhere to the priority AND point out the contradiction.


      Filtering the transcript: Use only subject-specific/technical passages from
      the transcript; ignore organizational matters/small talk, groups/appointments,
      and meta-hints.


      Only use time ranges that thematically fit the "Subject/Chapter".


      Strict citation requirement: Every bullet point or table entry MUST include
      exactly one source citation (File + Page|Timecode).


      Terminology fidelity: Use terms exactly as they appear in the sources.'
    value_type: string
  - description: ''
