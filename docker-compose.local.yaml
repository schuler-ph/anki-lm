# Local development compose — runs the AnkiLM backend stack
# Dify itself runs separately (see infra/hetzner/ for production setup)
#
# Usage:
#   cp src/backend/.env.example src/backend/.env  # fill in values
#   docker compose -f docker-compose.local.yaml up

services:
  orchestrator:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    env_file:
      - src/backend/.env
    volumes:
      # Mount your local lecture folder (same as LECTURE_ROOT in .env)
      - "${LECTURE_ROOT:-./tmp/lectures}:/data/lectures"
      # Mount GCS service account key if using GCS
      # - "${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/app/secrets/gcs-sa-key.json:ro"
    restart: "no"

  # Local file-acceptor (used while Dify still points to local setup)
  file-acceptor-local:
    build:
      context: ./src/backend
      dockerfile: Dockerfile.file-acceptor-local
    env_file:
      - src/backend/.env
    ports:
      - "8019:8019"
    volumes:
      - "${LECTURE_ROOT:-./tmp/lectures}:/data/lectures"
    restart: unless-stopped
