name: Deploy file-acceptor to Cloud Run

on:
  push:
    branches: [master]
    paths:
      - 'src/file-acceptor/**'
      - '.github/workflows/deploy-file-acceptor.yml'

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: europe-west3
  IMAGE: europe-west3-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ankilm/file-acceptor
  SERVICE: ankilm-file-acceptor

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # for Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          # Use Workload Identity Federation (no long-lived SA key needed)
          # Set up with: gcloud iam workload-identity-pools create ...
          # See: https://cloud.google.com/iam/docs/workload-identity-federation-with-deployment-pipelines
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} \
                       -t ${{ env.IMAGE }}:latest \
                       src/file-acceptor/
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image ${{ env.IMAGE }}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --quiet
